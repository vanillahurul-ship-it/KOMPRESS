services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/bank-sampah-macodes-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: ${PORT:-5000}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - ml_models:/app/src/python/models
    expose:
      - "5000"
    mem_limit: 512m

  frontend:
    image: ghcr.io/${GHCR_OWNER}/bank-sampah-macodes-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    mem_limit: 128m

volumes:
  ml_models:
